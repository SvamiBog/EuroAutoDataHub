# EuroAutoDataHub/docker-compose.yml
#
# make dc-up      — PostgreSQL, Kafka, миграции, ingestor, API и планировщик обходов
# make run-oto    — разовый обход вручную (сервис scrapy_runner, профиль tools)
services:
  db_postgres:
    image: postgres:15-alpine
    container_name: euroautodatahub_postgres_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      # Используем переменные из .env файла
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Kafka в режиме KRaft (без ZooKeeper): один узел — брокер и контроллер
  kafka_broker:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka_broker
    ports:
      # Порт для доступа с хост-машины (если Scrapy запускается с хоста)
      - "9094:9094"
    environment:
      # ID кластера KRaft: UUID в base64 (22 символа)
      CLUSTER_ID: "sTIfD2AcQZKZUFKLMFqGrw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka_broker:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9094"
      # Адрес, который Kafka анонсирует клиентам: внутри Docker сети и с хост-машины
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka_broker:9092,PLAINTEXT_HOST://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Неделя истории: хватает, чтобы переобработать сообщения после сбоя
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Создает топики контракта (libs/eadh_common/messages.py) с нужным числом партиций
  kafka_init:
    image: confluentinc/cp-kafka:7.7.1
    container_name: kafka_init
    depends_on:
      kafka_broker:
        condition: service_healthy
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - |
        set -e
        for spec in listing_observations:6 crawl_events:1 ingest_dlq:1; do
          kafka-topics --bootstrap-server kafka_broker:9092 --create --if-not-exists \
            --topic "$${spec%%:*}" --partitions "$${spec##*:}" --replication-factor 1
        done
        kafka-topics --bootstrap-server kafka_broker:9092 --list
    restart: "no"

  api_migrations:
    build:
      context: .
      dockerfile: ./services/api_service/Dockerfile
    container_name: api_service_migrations
    depends_on:
      db_postgres:
        condition: service_healthy
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_SERVER=db_postgres
      - POSTGRES_PORT=5432
    volumes:
      - ./services/api_service:/app
    working_dir: /app
    command: alembic upgrade head

  # Приём сообщений из Kafka, жизненный цикл объявлений, курсы ЕЦБ, отчёты о прогонах
  ingestor:
    build:
      context: .
      dockerfile: ./services/data_processor/Dockerfile
    container_name: ingestor_service
    restart: on-failure
    depends_on:
      db_postgres:
        condition: service_healthy
      kafka_init:
        condition: service_completed_successfully
      api_migrations:
        condition: service_completed_successfully
    # MAX_DELIST_RATIO, TELEGRAM_* и другие настройки — из .env (см. .env.example)
    env_file:
      - .env
    environment:
      - POSTGRES_SERVER=db_postgres
      - POSTGRES_PORT=5432
      - KAFKA_BOOTSTRAP_SERVERS=kafka_broker:9092
    volumes:
      - ./services/data_processor/app:/app/app

  api_service:
    build:
      context: .
      dockerfile: ./services/api_service/Dockerfile
    container_name: api_service_app
    ports:
      - "8000:8000"
    depends_on:
      db_postgres:
        condition: service_healthy
      api_migrations:
        condition: service_completed_successfully
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_SERVER=db_postgres
      - POSTGRES_PORT=5432
      # Админка /admin: вход и управление планировщиком
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - SCHEDULER_URL=http://scheduler:8001
      - CRAWL_TZ=${CRAWL_TZ:-Europe/Warsaw}
      # Резервные копии (сервис backup) и проверка алертов в Telegram
      - BACKUP_DIR=/backups
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./services/api_service:/app
      - ./backups:/backups:ro
    working_dir: /app
    restart: unless-stopped

  # Ежедневный запуск обходов (CRAWL_AT, CRAWL_TZ, CRAWL_SPIDERS — в .env)
  scheduler:
    build:
      context: .
      dockerfile: ./services/scrapy_spiders/car_scrapers/Dockerfile
    container_name: crawl_scheduler
    command: python -m car_scrapers.scheduler
    depends_on:
      kafka_init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka_broker:9092
      # В Docker логи пишем в stdout, прогресс-бар выключаем
      - SCRAPY_LOG_FILE=
      - SCRAPY_PROGRESS_BAR=false
      # Сырые ответы площадки (gzip, 14 дней) для переразбора и отладки
      - SCRAPY_RAW_RESPONSES_DIR=/data/raw
    volumes:
      - ./services/scrapy_spiders/car_scrapers/car_scrapers:/usr/src/app/car_scrapers
      - raw_responses:/data/raw
      # последний запуск: после выключения компьютера пропущенный ночной обход догоняется
      - scheduler_state:/data/state
    restart: unless-stopped

  # Ежедневная резервная копия PostgreSQL в ./backups с проверкой восстановления (ops/backup/backup.sh)
  backup:
    image: postgres:15-alpine
    container_name: db_backup
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      db_postgres:
        condition: service_healthy
    environment:
      - PGHOST=db_postgres
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB}
      - BACKUP_AFTER_UTC=${BACKUP_AFTER_UTC:-01:30}
      - BACKUP_KEEP=${BACKUP_KEEP:-14}
    volumes:
      - ./backups:/backups
      - ./ops/backup/backup.sh:/backup.sh:ro
    entrypoint: [ "sh", "/backup.sh" ]
    command: [ "loop" ]
    restart: unless-stopped

  # Разовый обход вручную: make run-oto MAKES=audi,bmw
  scrapy_runner:
    build:
      context: .
      dockerfile: ./services/scrapy_spiders/car_scrapers/Dockerfile
    container_name: scrapy_runner_service
    profiles: [ "tools" ]
    depends_on:
      kafka_init:
        condition: service_completed_successfully
    # SCRAPY_* из .env настраивают лимиты, паузы и логи (см. .env.example)
    env_file:
      - .env
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka_broker:9092
      # В Docker логи пишем в stdout, прогресс-бар выключаем
      - SCRAPY_LOG_FILE=
      - SCRAPY_PROGRESS_BAR=false
    volumes:
      - ./services/scrapy_spiders/car_scrapers/car_scrapers:/usr/src/app/car_scrapers
      - raw_responses:/data/raw

  # --- BI (профиль bi): make bi-up, затем make bi-provision ---

  # Служебная БД Metabase в том же PostgreSQL
  metabase_db_init:
    image: postgres:15-alpine
    container_name: metabase_db_init
    profiles: [ "bi" ]
    depends_on:
      db_postgres:
        condition: service_healthy
    environment:
      - PGHOST=db_postgres
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB}
    entrypoint: [ "/bin/sh", "-c" ]
    command:
      - psql -tc "SELECT 1 FROM pg_database WHERE datname = 'metabase'" | grep -q 1 || psql -c "CREATE DATABASE metabase"
    restart: "no"

  metabase:
    image: metabase/metabase:v0.50.36
    container_name: metabase
    profiles: [ "bi" ]
    ports:
      - "3000:3000"
    depends_on:
      metabase_db_init:
        condition: service_completed_successfully
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: db_postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
      MB_CHECK_FOR_UPDATES: "false"
      MB_ANON_TRACKING_ENABLED: "false"
      JAVA_OPTS: "-Xmx1g"
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:3000/api/health || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres_data:
  kafka_data:
  raw_responses:
  scheduler_state:
