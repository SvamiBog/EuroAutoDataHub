name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        # Версия Python берется из .python-version, lock-файл должен быть актуален
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Tests
        run: make test

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
