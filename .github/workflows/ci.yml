name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Тесты с маркером pg создают временные БД на этом сервере
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        # Версия Python берется из .python-version, lock-файл должен быть актуален
        run: uv sync --locked

      - name: Lint
        run: make lint

      - name: Tests
        run: make test

      - name: Migrations on a clean database
        # Миграции применяются с нуля, а схема совпадает с моделями (alembic check)
        working-directory: services/api_service
        env:
          SYNC_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/postgres
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Validate docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
