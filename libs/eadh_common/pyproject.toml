[project]
name = "eadh-common"
version = "0.2.0"
description = "Общая модель данных, контракт сообщений Kafka и настройки EuroAutoDataHub"
requires-python = ">=3.11"
dependencies = [
    "sqlmodel==0.0.24",
    "sqlalchemy[asyncio]==2.0.41",
    "pydantic==2.11.4",
    "pydantic-settings>=2.3.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
