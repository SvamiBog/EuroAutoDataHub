[project]
name = "euroautodatahub"
version = "0.1.0"
description = "Ежедневный сбор объявлений о продаже авто с европейских площадок, аналитика и поиск аномалий"
readme = "README.md"
# Docker-образы сервисов собираются на Python 3.11
requires-python = ">=3.11,<3.14"
# Зависимости всех сервисов для локальной разработки и тестов.
# В Docker каждый сервис ставит свой requirements.txt — версии должны совпадать.
dependencies = [
    # Общая модель данных и контракт сообщений (libs/eadh_common)
    "eadh-common",
    # Сбор данных (services/scrapy_spiders)
    "scrapy==2.13.0",
    "twisted==24.11.0",
    "kafka-python-ng>=2.1.2",
    "rich>=14.0.0",
    # Обработка и хранение (services/data_processor)
    "sqlmodel==0.0.24",
    "sqlalchemy[asyncio]==2.0.41",
    "asyncpg==0.30.0",
    "pydantic==2.11.4",
    "pydantic-settings>=2.3.4",
    "aiokafka>=0.11",
    "httpx>=0.27",
    # ML: модели справедливой цены и срока продажи (services/data_processor/app/ml)
    "lightgbm>=4.5",
    "numpy>=1.26",
    # Планировщик: часовые пояса в slim-образах
    "tzdata>=2024.1",
    # API и миграции (services/api_service)
    "fastapi==0.115.12",
    "uvicorn[standard]>=0.34",
    "alembic>=1.15",
    "psycopg2-binary>=2.9.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20",
    "ruff>=0.6",
]

[tool.uv.workspace]
members = ["libs/eadh_common"]

[tool.uv.sources]
eadh-common = { workspace = true }
